apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: "fineract-server"
        scrape_interval: 5s
        metrics_path: "/fineract-provider/actuator/prometheus"
        scheme: "https"
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets: ["fineract-server:8443"]
